name: Daily GAM Refresh

# Scheduled workflows queue behind everyone else's GitHub Actions runs, and GitHub's own docs
# warn this queueing is worst exactly on the hour (00, :06:00 etc. are the most contended
# minute of any hour across all of GitHub). This was `0 6 * * *` and, since ~27 Aug 2026,
# started landing 3.5-6h late most days (confirmed from the auto-refresh commit timestamps,
# not a regression in this script — the delay isn't correlated with data size, it's GitHub
# Actions queue congestion at the top of the hour). Moved much earlier and off the exact hour
# so a similar multi-hour delay still lands well before the 9am deadline this feeds.
on:
  schedule:
    - cron: '13 1 * * *'   # 01:13 UTC — leaves ~6h of buffer to a 9am UTC/BST deadline
  workflow_dispatch:

concurrency:
  group: daily-gam-refresh
  cancel-in-progress: false   # let an overlapping run finish rather than losing its work

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # guards against a hung GAM call silently eating the whole buffer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache node modules and Puppeteer
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run GAM data refresh
        id: refresh
        run: node scripts/refresh.js
        env:
          GAM_NETWORK_CODE: ${{ secrets.GAM_NETWORK_CODE }}
          GAM_CLIENT_ID: ${{ secrets.GAM_CLIENT_ID }}
          GAM_CLIENT_SECRET: ${{ secrets.GAM_CLIENT_SECRET }}
          GAM_REFRESH_TOKEN: ${{ secrets.GAM_REFRESH_TOKEN }}

      - name: Capture new screenshots
        run: node scripts/screenshot-refresh.js
        continue-on-error: true

      # Commits the freshly-fetched GAM data even if the screenshot step above failed —
      # a screenshot/Puppeteer flake is unrelated to GAM data quality and must not silently
      # discard a full day's refresh. Still gated on the GAM refresh itself having succeeded.
      - name: Commit and push updated data and screenshots
        if: always() && steps.refresh.outcome == 'success'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/data/ public/screenshots/
          git diff --staged --quiet || git commit -m "chore: auto-refresh GAM data and screenshots"
          git push
